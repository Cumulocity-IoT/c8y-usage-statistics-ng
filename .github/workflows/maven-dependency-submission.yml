name: Maven dependency submission

# GitHub only reads the direct entries of metrics-aggregator/pom.xml, and most
# of them get their version from the Cumulocity BOM, so Dependabot cannot see
# Spring, Jackson, Tomcat and the other transitive dependencies. This job
# resolves the full Maven tree and submits it to the dependency graph, which
# turns on Dependabot alerts for the microservice.

on:
  push:
    branches: [main]
    paths:
      - metrics-aggregator/pom.xml
      - .github/workflows/maven-dependency-submission.yml
  schedule:
    # Weekly, so a new BOM or Spring Boot patch on the Cumulocity repo is picked up.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write # submit the dependency snapshot

concurrency:
  group: maven-dependency-submission
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Submit the Maven dependency tree
        uses: advanced-security/maven-dependency-submission-action@v6
        with:
          directory: metrics-aggregator
